<ellipse cx='380' cy='70' rx='80' ry='22' fill='#1e293b' stroke='#64748b' stroke-width='2'/>
<line x1='300' y1='70' x2='300' y2='390' stroke='#64748b' stroke-width='2'/>
<line x1='460' y1='70' x2='460' y2='390' stroke='#64748b' stroke-width='2'/>
<ellipse cx='380' cy='390' rx='80' ry='22' fill='#1e293b' stroke='#64748b' stroke-width='2'/>
<line x1='380' y1='25' x2='380' y2='70' stroke='#38bdf8' stroke-width='3.5' marker-end='url(#axis-arr)'/>
<line x1='380' y1='390' x2='380' y2='435' stroke='#38bdf8' stroke-width='3.5' marker-end='url(#axis-arr)'/>
<text x='398' y='45' font-size='18' font-weight='700' fill='#38bdf8'>Tensile Stress σ</text>
<ellipse cx='380' cy='230.0' rx='80' ry='42' fill='#334155' fill-opacity='0.6' stroke='#fbbf24' stroke-width='2.6' transform='rotate(-25 380 230.0)'/>
<line x1='380' y1='230.0' x2='470' y2='130.0' stroke='#a855f7' stroke-width='2.8' marker-end='url(#schmid-arr)'/>
<text x='485' y='125.0' font-size='17' font-weight='700' fill='#a855f7'>Normal n (Angle φ)</text>
<line x1='380' y1='230.0' x2='490' y2='200.0' stroke='#10b981' stroke-width='2.8' marker-end='url(#schmid-arr)'/>
<text x='505' y='205.0' font-size='17' font-weight='700' fill='#10b981'>Slip Direction s (Angle λ)</text>
<line x1='380' y1='70' x2='380' y2='390' stroke='#94a3b8' stroke-width='1.5' stroke-dasharray='4,4'/>
<rect x='30' y='180' width='230' height='130' rx='8' fill='#1e293b' stroke='#334155' stroke-width='1.5'/>
<text x='145' y='210' font-size='16' font-weight='700' fill='#f8fafc' text-anchor='middle'>Schmid's Law</text>
<text x='145' y='240' font-size='16' font-weight='600' fill='#fbbf24' text-anchor='middle'>τ_R = σ cos(φ) cos(λ)</text>
<text x='145' y='270' font-size='14' font-weight='600' fill='#34d399' text-anchor='middle'>Max shear at φ = λ = 45°</text>
<text x='145' y='295' font-size='14' font-weight='600' fill='#38bdf8' text-anchor='middle'>τ_R,max = 0.5 σ</text>
