<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 590" width="100%" height="auto" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
    <!-- Soft shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title matching slide styling -->
  <text x="50" y="36" font-size="20" font-weight="700" fill="#0f172a">▪ Bill of material</text>
  <text x="50" y="56" font-size="12" fill="#64748b">Product Structure Tree for Bookcase (Fig. P3.2) — INDU 211 / Chapter 3 Standard</text>

  <!-- Level Indicators on Left -->
  <g font-size="11" font-weight="600" fill="#64748b">
    <text x="50" y="106">Level 0</text>
    <line x1="50" y1="112" x2="115" y2="112" stroke="#cbd5e1" stroke-width="1"/>
    
    <text x="50" y="222">Level 1</text>
    <line x1="50" y1="228" x2="115" y2="228" stroke="#cbd5e1" stroke-width="1"/>

    <text x="50" y="346">Level 2</text>
    <line x1="50" y1="352" x2="115" y2="352" stroke="#cbd5e1" stroke-width="1"/>

    <text x="50" y="472">Level 3</text>
    <line x1="50" y1="478" x2="115" y2="478" stroke="#cbd5e1" stroke-width="1"/>
  </g>

  <!-- ==================== CONNECTING BUS LINES & ARROWS ==================== -->
  <g stroke="#0f172a" stroke-width="1.8" fill="none">
    <!-- Level 0 down to Level 1 Bus -->
    <line x1="475" y1="130" x2="475" y2="164"/>
    
    <!-- Level 1 Horizontal Bus -->
    <line x1="225" y1="164" x2="760" y2="164"/>
    
    <!-- Level 1 Drops with Arrows -->
    <line x1="225" y1="164" x2="225" y2="198" marker-end="url(#arrow)"/>
    <line x1="475" y1="164" x2="475" y2="198" marker-end="url(#arrow)"/>
    <line x1="760" y1="164" x2="760" y2="198" marker-end="url(#arrow)"/>

    <!-- From S1 to Level 2 Bus -->
    <line x1="225" y1="262" x2="225" y2="292"/>
    <line x1="140" y1="292" x2="310" y2="292"/>
    <line x1="140" y1="292" x2="140" y2="324" marker-end="url(#arrow)"/>
    <line x1="310" y1="292" x2="310" y2="324" marker-end="url(#arrow)"/>

    <!-- From C1 to Level 3 R1 -->
    <line x1="140" y1="386" x2="140" y2="450" marker-end="url(#arrow)"/>

    <!-- From C2 to Level 3 R3 -->
    <line x1="310" y1="386" x2="310" y2="450" marker-end="url(#arrow)"/>

    <!-- From C3 to Level 3 R2 -->
    <line x1="475" y1="262" x2="475" y2="450" marker-end="url(#arrow)"/>
  </g>

  <!-- ==================== QUANTITY LABELS ON ARROWS ==================== -->
  <g font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">
    <!-- Level 1 -->
    <text x="233" y="188">(2)</text>
    <text x="483" y="188">(3)</text>
    <text x="768" y="188">(18)</text>

    <!-- Level 2 (under S1) -->
    <text x="147" y="312">(1)</text>
    <text x="317" y="312">(1)</text>

    <!-- Level 3 -->
    <text x="147" y="424">(1)</text>
    <text x="317" y="424">(1)</text>
    <text x="483" y="359">(1)</text>
  </g>

  <!-- ==================== LEVEL 0 NODES ==================== -->
  <!-- Product Box -->
  <g filter="url(#shadow)">
    <rect x="370" y="76" width="210" height="54" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <text x="475" y="100" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Product</text>
    <text x="475" y="118" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">Bookcase Assembly</text>
  </g>

  <!-- Assembly Oval (Exact matching lecture slide) -->
  <g filter="url(#shadow)">
    <ellipse cx="655" cy="103" rx="55" ry="21" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <text x="655" y="108" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Assembly</text>
  </g>

  <!-- ==================== LEVEL 1 NODES ==================== -->
  <!-- S1: Side Panel Sub-Assembly -->
  <g filter="url(#shadow)">
    <rect x="135" y="202" width="180" height="60" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <text x="225" y="225" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">S1</text>
    <text x="225" y="242" font-size="11.5" font-weight="600" fill="#0369a1" text-anchor="middle">Side Panel Sub-Assy</text>
    <text x="225" y="254" font-size="9" fill="#64748b" text-anchor="middle">[Panel + Decal · Qty: 2]</text>
  </g>

  <!-- C3: Shelf -->
  <g filter="url(#shadow)">
    <rect x="390" y="202" width="170" height="60" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <text x="475" y="225" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">C3</text>
    <text x="475" y="242" font-size="11.5" font-weight="600" fill="#047857" text-anchor="middle">Shelf (Wood)</text>
    <text x="475" y="254" font-size="9" fill="#64748b" text-anchor="middle">[2' × 2' × ¾" · Qty: 3]</text>
  </g>

  <!-- C4: Screws -->
  <g filter="url(#shadow)">
    <rect x="680" y="202" width="160" height="60" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <text x="760" y="225" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">C4</text>
    <text x="760" y="242" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle">Screws (Fasteners)</text>
    <text x="760" y="254" font-size="9" fill="#64748b" text-anchor="middle">[Purchased · Qty: 18]</text>
  </g>

  <!-- ==================== LEVEL 2 NODES (under S1) ==================== -->
  <!-- C1: Side Panel (wood) -->
  <g filter="url(#shadow)">
    <rect x="65" y="326" width="150" height="60" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <text x="140" y="348" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">C1</text>
    <text x="140" y="364" font-size="11" font-weight="600" fill="#047857" text-anchor="middle">Side Panel (Wood)</text>
    <text x="140" y="377" font-size="9" fill="#64748b" text-anchor="middle">[3'2" × 2' × ¾" · Dado ⅜"]</text>
  </g>

  <!-- C2: University Decal -->
  <g filter="url(#shadow)">
    <rect x="235" y="326" width="150" height="60" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <text x="310" y="348" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">C2</text>
    <text x="310" y="364" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">University Decal</text>
    <text x="310" y="377" font-size="9" fill="#64748b" text-anchor="middle">[Purchased · Glued]</text>
  </g>

  <!-- ==================== LEVEL 3 NODES (Raw Materials) ==================== -->
  <!-- R1: Lumber for Side Panel -->
  <g filter="url(#shadow)">
    <rect x="55" y="452" width="170" height="56" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <text x="140" y="474" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">R1</text>
    <text x="140" y="490" font-size="10.5" font-weight="600" fill="#b45309" text-anchor="middle">Lumber 3'2" × 2' × ¾"</text>
    <text x="140" y="501" font-size="9" fill="#64748b" text-anchor="middle">[Raw Board Stock · Qty: 2]</text>
  </g>

  <!-- R3: Adhesive / Glue -->
  <g filter="url(#shadow)">
    <rect x="240" y="452" width="140" height="56" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <text x="310" y="474" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">R3</text>
    <text x="310" y="490" font-size="10.5" font-weight="600" fill="#b45309" text-anchor="middle">Adhesive / Glue</text>
    <text x="310" y="501" font-size="9" fill="#64748b" text-anchor="middle">[For Decals · Consumable]</text>
  </g>

  <!-- R2: Lumber for Shelf -->
  <g filter="url(#shadow)">
    <rect x="395" y="452" width="160" height="56" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <text x="475" y="474" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">R2</text>
    <text x="475" y="490" font-size="10.5" font-weight="600" fill="#b45309" text-anchor="middle">Lumber 2' × 2' × ¾"</text>
    <text x="475" y="501" font-size="9" fill="#64748b" text-anchor="middle">[Raw Board Stock · Qty: 3]</text>
  </g>

  <!-- Classification Legend matching Chapter 3 conventions -->
  <g transform="translate(635, 335)">
    <rect x="0" y="0" width="325" height="175" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="14" y="24" font-size="12" font-weight="700" fill="#0f172a">BOM Notation Key (Lecture 3):</text>
    
    <text x="14" y="50" font-size="11" font-weight="700" fill="#0f172a">Product / Oval</text>
    <text x="120" y="50" font-size="11" fill="#334155">= Final Assembly (Bookcase)</text>

    <text x="14" y="75" font-size="11" font-weight="700" fill="#0369a1">S1</text>
    <text x="120" y="75" font-size="11" fill="#334155">= Sub-Assembly (Manufactured)</text>

    <text x="14" y="100" font-size="11" font-weight="700" fill="#047857">C1, C2, C3, C4</text>
    <text x="120" y="100" font-size="11" fill="#334155">= Components (Make / Buy)</text>

    <text x="14" y="125" font-size="11" font-weight="700" fill="#b45309">R1, R2, R3</text>
    <text x="120" y="125" font-size="11" fill="#334155">= Raw Materials / Stock</text>

    <text x="14" y="150" font-size="11" font-weight="700" fill="#0f172a">(n) on Arrow</text>
    <text x="120" y="150" font-size="11" fill="#334155">= Quantity required per parent</text>
  </g>
</svg>
